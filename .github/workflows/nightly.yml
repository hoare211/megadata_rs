name: Nightly

# 每日定时 + 手动触发：跑 CI 里为省时被 skip 的 proptest fuzz 单测，
# 并把失败种子上传为 artifact（proptest 的 persistence 目录）。
on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 北京时间凌晨 2 点
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test（全量，含 fuzz）
        # 与 ci.yml 的 rust-test 对应：这里不 skip，fuzz 每天夜间全量跑。
        # PROPTEST_CASES 控制每条 property 的用例数（默认偏大，夜里有预算可放宽）。
        env:
          PROPTEST_CASES: 256
        run: cargo test --lib -p megadata_rs
      - name: 上传失败种子（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: |
            proptest-regressions/
          if-no-files-found: ignore
          retention-days: 14
